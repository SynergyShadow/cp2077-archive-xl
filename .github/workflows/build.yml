name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'lib/**'
      - 'bundle/**'
      - 'scripts/**'
      - 'config/**'
      - 'tools/dist/**'
      - 'xmake.lua'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        shell: pwsh
        run: xmake f -m release -a x64 -y

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          xmake build
          if ($LASTEXITCODE -ne 0) {
            throw "Xmake build failed with exit code $LASTEXITCODE"
          }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = Join-Path $PWD 'stage'
          $dist = Join-Path $PWD 'dist'

          Remove-Item $stage, $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null

          # Find the compiled DLL.
          $dll = Get-ChildItem -Path build -Filter 'ArchiveXL.dll' -File -Recurse |
            Select-Object -First 1

          if (-not $dll) {
            throw 'ArchiveXL.dll was not found. Check the Build step.'
          }

          Copy-Item $dll.FullName (Join-Path $dist 'ArchiveXL.dll') -Force

          # Bundle: preserve the repository's actual .archive and .xl files.
          if (-not (Test-Path 'bundle' -PathType Container)) {
            throw 'The repository bundle directory was not found.'
          }

          Copy-Item 'bundle' (Join-Path $dist 'Bundle') -Recurse -Force

          # Generate the REDscript bundles from the scripts source.
          $compose = 'tools/dist/steps/compose-redscripts.ps1'

          if (-not (Test-Path $compose -PathType Leaf)) {
            throw "REDscript composition script not found: $compose"
          }

          & $compose -StageDir $stage -ProjectName 'ArchiveXL' -Version '2.5'

          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw 'REDscript composition failed.'
          }

          $generatedScripts = Join-Path $stage 'red4ext/plugins/ArchiveXL/Scripts'

          if (-not (Test-Path $generatedScripts -PathType Container)) {
            throw "Generated Scripts directory not found: $generatedScripts"
          }

          Copy-Item $generatedScripts (Join-Path $dist 'Scripts') -Recurse -Force

          # Include the runtime configuration and licenses.
          $yaml = Get-ChildItem -Path . -Filter 'ArchiveXL.yaml' -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](\.git|build|dist|stage)[\\/]'
            } |
            Select-Object -First 1

          if (-not $yaml) {
            throw 'ArchiveXL.yaml was not found.'
          }

          Copy-Item $yaml.FullName (Join-Path $dist 'ArchiveXL.yaml') -Force

          foreach ($file in @('LICENSE', 'THIRD_PARTY_LICENSES')) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required file not found: $file"
            }

            Copy-Item $file (Join-Path $dist $file) -Force
          }

          # Verify expected REDscript filenames.
          $expected = @(
            'ArchiveXL.DynamicAppearance.reds',
            'ArchiveXL.Global.reds',
            'ArchiveXL.reds'
          )

          foreach ($file in $expected) {
            if (-not (Test-Path (Join-Path $dist "Scripts\$file"))) {
              throw "Expected generated REDscript file is missing: $file"
            }
          }

          Write-Host 'Final ArchiveXL-2.5 package:'
          Get-ChildItem $dist -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveXL-2.5
          path: dist/
          if-no-files-found: error
