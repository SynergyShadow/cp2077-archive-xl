name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'lib/**'
      - 'bundle/**'
      - 'scripts/**'
      - '**/*.reds'
      - 'xmake.lua'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        run: xmake f -m release -a x64 -y

      - name: Build
        run: xmake build -y

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force dist | Out-Null

          $dll = Get-ChildItem -Path build -Filter 'ArchiveXL.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $dll) {
            $dll = Get-ChildItem -Path . -Filter 'ArchiveXL.dll' -File -Recurse |
              Where-Object { $_.FullName -notmatch '[\\/](\.git|\.github|dist)[\\/]' } |
              Select-Object -First 1
          }

          if (-not $dll) {
            throw 'ArchiveXL.dll was not found.'
          }

          Copy-Item $dll.FullName 'dist\ArchiveXL.dll' -Force

          foreach ($d in @('bundle', 'scripts')) {
            if (Test-Path $d -PathType Container) {
              Copy-Item $d "dist\$d" -Recurse -Force
            }
          }

          Get-ChildItem -Path . -Filter '*.reds' -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|\.github|dist|build)[\\/]' } |
            ForEach-Object {
              $destination = Join-Path 'dist' $_.Name
              Copy-Item $_.FullName $destination -Force
            }

          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveXL-2.5
          path: dist
